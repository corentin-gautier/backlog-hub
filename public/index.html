<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Window title bar, the same as the top bar. -->
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)">
<title>Backlog Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
	<div id="tabs"><button data-home title="Home"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.8l5.5 4.4V13a.5.5 0 0 1-.5.5H9.8V10H6.2v3.5H3a.5.5 0 0 1-.5-.5Z"/></svg>Home</button></div>
	<button id="claude" title="Claude in this project (Ctrl+`)" hidden><span class="spark">✻</span>Claude</button>
	<button id="code" title="Open the project in VS Code" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg>VS Code</button>
	<button id="add" title="Add a project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
</nav>
<section id="home">
	<div id="today"></div>
	<h1>My projects</h1>
	<div id="top">
		<section class="part" data-part="alerts" hidden><h2><i class="chevron"></i>Coming up <span class="count"></span></h2><div class="alerts"></div></section>
		<section class="part" data-part="doing" hidden><h2><i class="chevron"></i>In progress <span class="count"></span></h2><div class="alerts"></div></section>
		<section class="part" data-part="claude"><h2><i class="chevron"></i>Claude</h2><div id="general"></div></section>
	</div>
	<div id="groups"></div>
	<button id="new-category">+ New category</button>
</section>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="app.js"></script>
<script src="claude.js"></script>
<script src="vault.js"></script>
</body>
</html>
